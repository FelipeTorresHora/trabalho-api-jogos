<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - Aventurem</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="home.html" class="logo">Aventurem</a>

      <button class="mobile-menu-toggle" aria-label="Menu">☰</button>

      <nav class="nav">
        <ul class="nav-links">
          <li><a href="home.html">Início</a></li>
          <li><a href="home.html#games">Jogos</a></li>
          <li id="adminLinkContainer" style="display: none;"><a href="admin.html" id="adminLink">Admin</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Buscar jogos...">
        </div>

        <button class="icon-btn" id="themeToggleBtn" onclick="ThemeManager.toggleTheme()" aria-label="Mudar tema" title="Mudar tema">☀️</button>

        <a href="cart.html" class="icon-btn active" aria-label="Carrinho">
          🛒
          <span class="cart-badge">0</span>
        </a>

        <a href="profile.html" class="icon-btn" aria-label="Perfil">👤</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-medium">
    <a href="home.html" class="back-button">← Voltar</a>
    <div id="cartContainer">
      <!-- Content will be loaded dynamically -->
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Show admin link if user is admin
    if (Auth.isAdmin()) {
      document.getElementById('adminLinkContainer').style.display = 'block';
    }
  </script>
</body>
</html>
