<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Aventurem</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <!-- Theme Toggle Button -->
  <button class="icon-btn" id="themeToggleBtn" onclick="ThemeManager.toggleTheme()" style="position: fixed; top: 20px; right: 20px; z-index: 9999; font-size: 24px;">☀️</button>

  <div class="register-container">
    <div class="register-card">
      <h1 class="logo text-center">Aventurem</h1>
      <p class="text-center text-secondary mb-xl">Crie sua conta</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nome Completo *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Digite seu nome completo"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="birthDate">Data de Nascimento *</label>
          <input
            type="date"
            id="birthDate"
            name="birthDate"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Telefone (opcional)</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="(00) 00000-0000"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha *</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 8 caracteres"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Digite a senha novamente"
            required
          >
        </div>

        <button type="submit" class="btn btn-full">Criar Conta</button>

        <p class="text-center mt-lg">
          Já tem conta? <a href="index.html">Fazer Login</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
