<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Compras - Aventurem</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="home.html" class="logo">Aventurem</a>

      <button class="mobile-menu-toggle" aria-label="Menu">☰</button>

      <nav class="nav">
        <ul class="nav-links">
          <li><a href="home.html">Início</a></li>
          <li><a href="home.html#games">Jogos</a></li>
          <li id="adminLinkContainer" style="display: none;"><a href="admin.html" id="adminLink">Admin</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="theme-toggle-container">
          <label class="theme-toggle" for="themeToggle">
            <span class="theme-option dark-mode">☀️</span>
            <input
              type="checkbox"
              id="themeToggle"
              aria-label="Alternar tema"
              onclick="ThemeManager.toggleTheme()"
            >
            <span class="theme-slider"></span>
            <span class="theme-option classic-mode">🌙</span>
          </label>
        </div>

        <a href="cart.html" class="icon-btn" aria-label="Carrinho">
          🛒
          <span class="cart-badge">0</span>
        </a>

        <a href="profile.html" class="icon-btn" aria-label="Perfil">👤</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container-medium">
    <a href="home.html" class="back-button">← Voltar</a>

    <h1 class="page-title">Histórico de Compras</h1>

    <div id="ordersContainer" class="orders-container">
      <!-- Orders will be loaded dynamically -->
    </div>
  </main>

  <!-- Review Modal -->
  <div id="reviewModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Avaliar Jogo</h2>
        <button class="modal-close" id="closeReviewModal">&times;</button>
      </div>
      <form id="reviewForm">
        <input type="hidden" id="reviewGameId">
        <input type="hidden" id="reviewOrderId">

        <div class="game-info" id="reviewGameInfo">
          <!-- Game info will be loaded here -->
        </div>

        <div class="form-group">
          <label>Avaliação</label>
          <div class="star-selector" id="starSelector">
            <span class="star-select" data-rating="1">★</span>
            <span class="star-select" data-rating="2">★</span>
            <span class="star-select" data-rating="3">★</span>
            <span class="star-select" data-rating="4">★</span>
            <span class="star-select" data-rating="5">★</span>
          </div>
          <input type="hidden" id="reviewRating" required>
        </div>

        <div class="form-group">
          <label for="reviewComment">Comentário</label>
          <textarea id="reviewComment" name="comment" rows="4" placeholder="Compartilhe sua experiência com este jogo..." required></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelReviewBtn">Cancelar</button>
          <button type="submit" class="btn">Enviar Avaliação</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/image-mapping.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/history.js"></script>
  <script>
    // Show admin link if user is admin
    if (Auth.isAdmin()) {
      document.getElementById('adminLinkContainer').style.display = 'block';
    }
  </script>
</body>
</html>
