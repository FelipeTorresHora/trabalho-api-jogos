<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Aventurem</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="home.html" class="logo">Aventurem</a>

      <button class="mobile-menu-toggle" aria-label="Menu">☰</button>

      <nav class="nav">
        <ul class="nav-links">
          <li><a href="home.html" class="active">Início</a></li>
          <li><a href="home.html#games">Jogos</a></li>
          <li id="adminLinkContainer" style="display: none;"><a href="admin.html" id="adminLink">Admin</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Buscar jogos...">
        </div>

        <div class="theme-toggle-container">
          <label class="theme-toggle" for="themeToggle">
            <span class="theme-option dark-mode">☀️</span>
            <input
              type="checkbox"
              id="themeToggle"
              aria-label="Alternar tema"
              onclick="ThemeManager.toggleTheme()"
            >
            <span class="theme-slider"></span>
            <span class="theme-option classic-mode">🌙</span>
          </label>
        </div>

        <a href="cart.html" class="icon-btn" aria-label="Carrinho">
          🛒
          <span class="cart-badge">0</span>
        </a>

        <a href="profile.html" class="icon-btn" aria-label="Perfil">👤</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Hero Carousel -->
    <section class="hero-carousel">
      <div id="heroSlides" class="hero-slides">
        <!-- Slides will be loaded dynamically -->
      </div>

      <!-- Navigation Controls -->
      <button class="hero-nav hero-prev" id="heroPrev" aria-label="Anterior">‹</button>
      <button class="hero-nav hero-next" id="heroNext" aria-label="Próximo">›</button>

      <!-- Indicators -->
      <div class="hero-indicators" id="heroIndicators">
        <!-- Indicators will be loaded dynamically -->
      </div>
    </section>

    <!-- All Games Section -->
    <section class="container" id="games">
      <div class="games-header">
        <h2 class="section-title">Todos os Jogos</h2>

        <!-- Category Filter -->
        <div class="category-filter" id="categoryFilter">
          <!-- Filter buttons will be loaded dynamically -->
        </div>
      </div>

      <div id="gamesGrid" class="grid grid-4">
        <!-- Games will be loaded dynamically -->
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/home.js"></script>
  <script>
    // Show admin link if user is admin
    if (Auth.isAdmin()) {
      document.getElementById('adminLinkContainer').style.display = 'block';
    }
  </script>
</body>
</html>
