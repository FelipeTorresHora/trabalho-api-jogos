<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Aventurem</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- Theme Toggle Button -->
  <button class="icon-btn" id="themeToggleBtn" onclick="ThemeManager.toggleTheme()" style="position: fixed; top: 20px; right: 20px; z-index: 9999; font-size: 24px;">☀️</button>

  <div class="login-container">
    <div class="login-card">
      <h1 class="logo text-center">Aventurem</h1>
      <p class="text-center text-secondary mb-xl">Entre na sua conta</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <button type="submit" class="btn btn-full">Entrar</button>

        <p class="text-center mt-lg">
          Não tem conta? <a href="register.html" id="createAccountLink">Crie Uma</a>
        </p>
      </form>

      <div class="demo-info">
        <p class="text-secondary text-center" style="font-size: 12px; margin-top: 24px;">
          <strong>Dados para teste:</strong><br>
          <strong>Admin:</strong> admin@avjd.com / admin123<br>
          <strong>Usuário:</strong> cliente@avjd.com / cliente123
        </p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
